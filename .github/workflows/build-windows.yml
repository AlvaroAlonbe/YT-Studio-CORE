name: Build YT Studio CORE Windows

on:
  workflow_dispatch:
  push:
    branches: [ "cloud-build-source" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Copy project files
        shell: pwsh
        run: |
          Copy-Item build_files\YTStudioCoreNative.vcxproj .\YTStudioCoreNative.vcxproj -Force
          Copy-Item build_files\YTStudioCoreNative.sln .\YTStudioCoreNative.sln -Force
          Copy-Item build_files\packages.config .\packages.config -Force
          Write-Host "Direct source tree:"
          Get-ChildItem src -Recurse

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore WebView2 SDK
        shell: pwsh
        run: nuget restore YTStudioCoreNative.sln -PackagesDirectory packages -NonInteractive

      - name: Build Release x64
        shell: pwsh
        run: msbuild YTStudioCoreNative.sln /m /t:Build /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\YTStudioCoreNative.exe")) { throw "EXE not generated" }
          Get-Item "dist\YTStudioCoreNative.exe" | Format-List Name,Length,LastWriteTime
          Get-ChildItem dist -Recurse

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: YT-Studio-CORE-Windows-x64
          path: dist\
          if-no-files-found: error
          retention-days: 30
