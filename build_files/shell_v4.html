<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YT Studio CORE Shell</title>
<style>
:root{
  color-scheme:dark;
  --bg:#020712;
  --glass:rgba(8,22,36,.68);
  --glass2:rgba(11,28,45,.54);
  --cyan:#42e8ff;
  --cyan2:#0aa8d8;
  --violet:#8067ff;
  --text:#e8f8ff;
  --muted:#76a8bd;
  --line:rgba(92,218,255,.24);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:"Segoe UI Variable","Segoe UI",sans-serif;color:var(--text)}
body{
  position:relative;
  background:
    radial-gradient(900px 250px at 20% -20%,rgba(29,190,255,.17),transparent 65%),
    radial-gradient(760px 300px at 80% 125%,rgba(112,79,255,.15),transparent 68%),
    linear-gradient(180deg,#071523 0%,#030914 100%);
}
body::before,body::after{
  content:"";position:absolute;border-radius:50%;filter:blur(42px);opacity:.34;pointer-events:none;
  animation:drift 8s ease-in-out infinite alternate;
}
body::before{width:300px;height:140px;left:12%;top:-90px;background:#19cfff}
body::after{width:280px;height:150px;right:9%;bottom:-105px;background:#7657ff;animation-delay:-4s}
.shell{position:relative;z-index:1;height:100%;padding:10px 14px 11px;display:grid;grid-template-rows:58px 1fr;gap:8px}
.row{display:flex;align-items:center;min-width:0}
.top{gap:12px}
.brand{display:flex;align-items:center;gap:11px;width:292px;min-width:230px}
.orb{width:42px;height:42px;border-radius:50%;position:relative;border:1px solid rgba(65,232,255,.78);box-shadow:0 0 23px rgba(40,213,255,.24),inset 0 0 17px rgba(94,81,255,.16);background:radial-gradient(circle at 50% 50%,#7e66ff 0 5%,#0b1730 6% 36%,transparent 37%)}
.orb::before,.orb::after{content:"";position:absolute;inset:5px;border:1px solid rgba(59,225,255,.55);border-radius:50%;animation:spin 7s linear infinite}
.orb::after{inset:10px;border-color:rgba(128,102,255,.7);animation-direction:reverse;animation-duration:4.5s}
.brandText{min-width:0}
.title{font-size:18px;font-weight:800;letter-spacing:.7px;color:#45eaff;text-shadow:0 0 18px rgba(53,224,255,.26);white-space:nowrap}
.sub{font-size:11px;letter-spacing:1.5px;color:#6da5ba;margin-top:3px;white-space:nowrap}
.tabs{display:flex;gap:8px;flex:1;justify-content:center;min-width:300px}
.glass,.tab,.iconBtn,.action,.pill{
  position:relative;overflow:hidden;
  border:1px solid rgba(77,203,238,.27);
  background:linear-gradient(155deg,rgba(16,43,62,.72),rgba(6,17,31,.68) 63%,rgba(21,15,52,.6));
  box-shadow:inset 0 1px 0 rgba(224,251,255,.14),inset 0 0 22px rgba(38,202,255,.045),0 10px 28px rgba(0,0,0,.2);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.glass::after,.tab::after,.iconBtn::after,.action::after,.pill::after{
  content:"";position:absolute;inset:-100% -45%;background:linear-gradient(110deg,transparent 43%,rgba(107,235,255,.13) 49%,rgba(142,107,255,.16) 52%,transparent 58%);
  transform:translateX(-45%);animation:sheen 7s linear infinite;pointer-events:none
}
.tab{height:42px;min-width:126px;padding:0 24px;border-radius:14px;color:#cdebf6;font-size:14px;font-weight:700;letter-spacing:.45px;cursor:pointer;transition:.2s ease}
.tab:hover,.iconBtn:hover,.action:hover{transform:translateY(-1px);border-color:rgba(78,229,255,.68);box-shadow:inset 0 1px rgba(255,255,255,.22),0 0 24px rgba(39,215,255,.14),0 12px 30px rgba(0,0,0,.24)}
.tab.active{color:#fff;border-color:#42e8ff;background:linear-gradient(150deg,rgba(22,80,103,.74),rgba(6,25,42,.72) 62%,rgba(44,28,91,.64));box-shadow:inset 0 1px rgba(255,255,255,.22),0 0 24px rgba(53,225,255,.16)}
.tab.active::before{content:"";position:absolute;left:19px;right:19px;bottom:4px;height:2px;border-radius:3px;background:linear-gradient(90deg,#3be9ff,#865fff);box-shadow:0 0 11px #3be9ff;animation:pulse 2.4s ease-in-out infinite}
.info{display:flex;gap:8px;justify-content:flex-end;width:420px;min-width:330px}
.pill{height:35px;border-radius:13px;padding:0 15px;display:flex;align-items:center;justify-content:center;color:#9edbed;font-size:12px;font-weight:650;letter-spacing:.5px;white-space:nowrap}
.pill.status{min-width:215px;color:#73ebff}
.context{gap:9px;padding:0 2px}
.group{display:flex;gap:8px;align-items:center}
.iconBtn,.action{
  height:41px;border-radius:13px;color:#e4f8ff;cursor:pointer;transition:.2s ease;font:inherit;font-weight:700;
}
.iconBtn{width:45px;display:grid;place-items:center;padding:0}
.iconBtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconBtn:disabled,.action:disabled{opacity:.36;cursor:default;transform:none!important;box-shadow:inset 0 1px rgba(255,255,255,.08)}
.contextCenter{flex:1;min-width:80px;display:flex;align-items:center;justify-content:center}
.modeLabel{height:36px;max-width:470px;padding:0 18px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#83bdd1;font-size:12px;letter-spacing:.7px;white-space:nowrap}
.action{padding:0 18px;min-width:118px}
.action.primary{border-color:rgba(126,97,255,.72);background:linear-gradient(145deg,rgba(72,50,159,.72),rgba(25,24,76,.72));color:#d8d1ff}
.action.downloadReady{border-color:rgba(62,229,255,.76);color:#dffcff}
.downloadWrap{position:relative}
.menu{display:none;position:absolute;right:0;top:46px;width:190px;padding:7px;border-radius:14px;z-index:20}
.menu.open{display:block;animation:pop .16s ease-out}
.menu button{width:100%;height:34px;border:0;border-radius:9px;background:transparent;color:#d7eff8;text-align:left;padding:0 11px;font:inherit;font-size:12px;cursor:pointer}
.menu button:hover{background:rgba(55,214,255,.1);color:#fff}
.progress{position:absolute;left:14px;right:14px;bottom:4px;height:2px;background:rgba(39,72,88,.45);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#28e8ff,#7c62ff);box-shadow:0 0 12px #36e9ff;transition:width .28s ease}
.hidden{display:none!important}
.spacer{flex:1}
.filesCounts{display:flex;gap:8px}
.count{font-size:11px;color:#7daec1;margin-left:7px}
@keyframes sheen{0%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
@keyframes drift{to{transform:translate(70px,35px) scale(1.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.55;filter:brightness(1.3)}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:1250px){
  .brand{width:230px}.info{width:335px}.pill.profile{display:none}.tab{min-width:108px;padding:0 17px}.pill.status{min-width:190px}
}
@media(max-width:1050px){
  .brand{width:205px}.sub{display:none}.tabs{min-width:260px}.tab{min-width:94px;padding:0 12px}.info{width:225px;min-width:225px}.pill.status{min-width:0;max-width:225px;overflow:hidden;text-overflow:ellipsis}
}
</style>
</head>
<body>
<div class="shell">
  <div class="row top">
    <div class="brand">
      <div class="orb"></div>
      <div class="brandText"><div class="title">YT STUDIO CORE</div><div class="sub">AURORA NATIVE SYSTEM · v2.5</div></div>
    </div>
    <div class="tabs">
      <button class="tab active" data-view="youtube">YOUTUBE</button>
      <button class="tab" data-view="editor">EDITOR</button>
      <button class="tab" data-view="files">ARCHIVOS</button>
    </div>
    <div class="info">
      <div id="profile" class="pill profile glass">FHD · 96 DPI</div>
      <div id="status" class="pill status glass">INICIANDO CORE</div>
    </div>
  </div>

  <div id="youtubeRow" class="row context">
    <div class="group">
      <button id="back" class="iconBtn glass" aria-label="Atrás">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button id="forward" class="iconBtn glass" aria-label="Adelante">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button id="home" class="iconBtn glass" aria-label="Inicio">
        <svg viewBox="0 0 24 24"><path d="M4 11.5L12 5l8 6.5V20H7v-6h10v6"/><path d="M9.5 20v-5h5v5"/></svg>
      </button>
      <button id="reload" class="iconBtn glass" aria-label="Recargar">
        <svg viewBox="0 0 24 24"><path d="M20 7v5h-5"/><path d="M19 12a7 7 0 10-1.6 5"/></svg>
      </button>
    </div>
    <div class="contextCenter"><div id="modeText" class="modeLabel glass">YOUTUBE CORE · NAVEGACIÓN INTEGRADA</div></div>
    <div class="downloadWrap">
      <button id="downloadBtn" class="action primary" disabled>DESCARGAR</button>
      <div id="downloadMenu" class="menu glass">
        <button data-dl="4k">Video 4K</button>
        <button data-dl="1080">Video 1080p</button>
        <button data-dl="720">Video 720p</button>
        <button data-dl="mp3">Audio MP3</button>
      </div>
    </div>
  </div>

  <div id="editorRow" class="row context hidden">
    <button id="editorReload" class="iconBtn glass" aria-label="Recargar editor">
      <svg viewBox="0 0 24 24"><path d="M20 7v5h-5"/><path d="M19 12a7 7 0 10-1.6 5"/></svg>
    </button>
    <div class="contextCenter"><div id="editorState" class="modeLabel glass">EDITOR CORE</div></div>
    <div id="helperPill" class="pill glass">COMPONENTES LOCALES</div>
  </div>

  <div id="filesRow" class="row context hidden">
    <button class="action glass" data-open="downloads">ABRIR DESCARGAS <span id="downloadsCount" class="count">0</span></button>
    <button class="action glass" data-open="edited">ABRIR EDITADOS <span id="editedCount" class="count">0</span></button>
    <div class="contextCenter"><div class="modeLabel glass">BIBLIOTECA LOCAL · VIDEOS / YT STUDIO CORE</div></div>
  </div>

  <div class="progress"><i id="progressFill"></i></div>
</div>

<script>
const state={view:'youtube',canBack:false,canForward:false,isVideo:false,helper:false,downloadActive:false,progress:-1,downloadCount:0,editedCount:0};
const $=s=>document.querySelector(s);
const send=msg=>window.chrome?.webview?.postMessage(msg);
const rows={youtube:$('#youtubeRow'),editor:$('#editorRow'),files:$('#filesRow')};

function setView(v){
  state.view=v;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===v));
  Object.entries(rows).forEach(([k,el])=>el.classList.toggle('hidden',k!==v));
}
function render(s){
  Object.assign(state,s||{});
  setView(state.view||'youtube');
  $('#back').disabled=!state.canBack;
  $('#forward').disabled=!state.canForward;
  $('#downloadBtn').disabled=!state.isVideo||state.downloadActive;
  $('#downloadBtn').classList.toggle('downloadReady',!!state.isVideo&&!state.downloadActive);
  $('#downloadBtn').textContent=state.downloadActive?('DESCARGANDO '+Math.max(0,Math.round(state.progress||0))+'%'):'DESCARGAR';
  $('#status').textContent=state.status||'CORE ONLINE';
  $('#profile').textContent=state.profile||'CORE';
  $('#helperPill').textContent=state.helper?'COMPONENTES ONLINE':'COMPONENTES NO DISPONIBLES';
  $('#helperPill').style.color=state.helper?'#73f3d0':'#ffafc0';
  $('#editorState').textContent=state.helper?'EDITOR CORE · ONLINE':'EDITOR CORE · MODO LIMITADO';
  $('#downloadsCount').textContent=state.downloadCount??0;
  $('#editedCount').textContent=state.editedCount??0;
  const p=Number(state.progress);
  $('#progressFill').style.width=p>=0?Math.max(0,Math.min(100,p))+'%':'0%';
  $('#progressFill').style.background=state.downloadFailed?'linear-gradient(90deg,#ff5878,#ff8a68)':'linear-gradient(90deg,#28e8ff,#7c62ff)';
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>send('view:'+b.dataset.view)));
$('#back').onclick=()=>send('back');
$('#forward').onclick=()=>send('forward');
$('#home').onclick=()=>send('home');
$('#reload').onclick=()=>send('reload');
$('#editorReload').onclick=()=>send('reload');
$('#downloadBtn').onclick=e=>{e.stopPropagation();$('#downloadMenu').classList.toggle('open')};
document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{send('download:'+b.dataset.dl);$('#downloadMenu').classList.remove('open')});
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>send('open:'+b.dataset.open));
document.addEventListener('click',()=>$('#downloadMenu').classList.remove('open'));
window.chrome?.webview?.addEventListener('message',e=>render(e.data));
send('ready');
</script>
</body>
</html>
